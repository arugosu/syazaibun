<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>昨日の件｜謝罪文組み立てノベル</title>
    <meta name="description" content="何をやらかしたか覚えていない主人公が、LINEで謝罪文を作って送るノベル風ミニゲーム。">
    <meta name="theme-color" content="#18181b">

    <!-- OGP / SNSシェア設定 -->
    <meta property="og:title" content="昨日の件｜謝罪文組み立てノベル">
    <meta property="og:description" content="何をやらかしたか覚えていない主人公が、LINEで謝罪文を作って送るノベル風ミニゲーム。">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="昨日の件｜謝罪文組み立てノベル">
    <meta name="twitter:description" content="何をやらかしたか覚えていない主人公が、LINEで謝罪文を作って送るノベル風ミニゲーム。">

    <!-- インラインSVGファビコン（外部ファイル不要） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231e293b'/%3E%3Cpath d='M16 20h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H26l-8 7v-7h-2a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z' fill='%238de055'/%3E%3Ccircle cx='25' cy='32' r='2.5' fill='%231e293b'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='%231e293b'/%3E%3Ccircle cx='39' cy='32' r='2.5' fill='%231e293b'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Noto Sans JP', sans-serif;
            --font-serif: 'Noto Serif JP', serif;
        }
        body {
            font-family: var(--font-sans);
            background-color: #18181b;
            color: #1f2937;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .font-novel {
            font-family: var(--font-serif);
        }
        /* スマホ縦画面フレーム（PCでも快適に表示・操作できるよう調整） */
        #app-frame {
            width: 100%;
            max-width: 520px;
            height: 100dvh;
            margin: 0 auto;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        @media (min-width: 640px) {
            body {
                padding: 16px 0;
            }
            #app-frame {
                height: calc(100dvh - 32px);
                border-radius: 20px;
            }
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.55);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
        /* アニメーション */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.35s ease-out forwards;
        }
        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .typing-dot:nth-child(1) { animation: pulseDot 1.2s infinite ease-in-out 0s; }
        .typing-dot:nth-child(2) { animation: pulseDot 1.2s infinite ease-in-out 0.2s; }
        .typing-dot:nth-child(3) { animation: pulseDot 1.2s infinite ease-in-out 0.4s; }

        /* LINE風吹き出しのしっぽ */
        .bubble-left {
            position: relative;
            background: #ffffff;
            border-radius: 16px;
            border-top-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .bubble-right {
            position: relative;
            background: #8de055;
            color: #111827;
            border-radius: 16px;
            border-top-right-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        /* ノベル画面テキストフェード */
        .novel-line {
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .novel-line.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div id="app-frame">
    <!-- ==================== 1. タイトル画面 ==================== -->
    <div id="screen-title" class="flex-1 flex flex-col justify-between p-8 bg-slate-50 text-slate-800 relative">
        <div class="flex justify-end items-center">
            <button id="btn-sound-toggle" class="p-2.5 rounded-full bg-slate-200/70 text-slate-600 hover:bg-slate-200 transition text-xs flex items-center gap-1.5" aria-label="音声切り替え">
                <span id="sound-icon">🔊</span>
                <span id="sound-label">音あり</span>
            </button>
        </div>

        <div class="my-auto text-center space-y-6">
            <div class="inline-block px-3 py-1 rounded-full bg-slate-200/80 text-slate-600 text-xs tracking-widest">
                謝罪文組み立てノベル
            </div>
            <h1 class="text-4xl font-bold tracking-widest text-slate-900 font-novel py-2">
                昨日の件
            </h1>
            <p class="text-xs text-slate-500 leading-relaxed">
                何をやらかしたか覚えていない。<br>
                とりあえず、長い謝罪文を送らなければならない。
            </p>
        </div>

        <div class="space-y-3 pb-4">
            <button id="btn-start" class="w-full py-4 rounded-xl bg-slate-900 text-white font-medium tracking-wider shadow-md hover:bg-slate-800 active:scale-[0.99] transition">
                はじめる
            </button>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-title-endings" class="py-3 rounded-xl bg-white border border-slate-200 text-slate-700 text-sm font-medium hover:bg-slate-100 transition">
                    エンド一覧 (<span id="title-end-count">0</span>/5)
                </button>
                <button id="btn-reset-confirm" class="py-3 rounded-xl bg-white border border-slate-200 text-slate-400 text-sm hover:text-red-500 hover:border-red-200 transition">
                    最初から
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== 2. ノベル画面（プロローグ / 結末 / 解放イベント / 真相ラスト） ==================== -->
    <div id="screen-novel" class="hidden flex-1 min-h-0 flex flex-col p-6 relative transition-colors duration-1000 cursor-pointer">
        <!-- 背景イラストレイヤー（SVG） -->
        <div id="novel-bg-layer" class="absolute inset-0 pointer-events-none overflow-hidden opacity-25 transition-opacity duration-1000"></div>

        <!-- 上部バー（スキップボタンなど） -->
        <div class="relative z-10 flex justify-between items-center min-h-[36px] shrink-0">
            <span id="novel-badge" class="text-xs tracking-widest opacity-60"></span>
            <button id="btn-novel-skip" class="hidden px-3 py-1.5 rounded-lg bg-black/10 hover:bg-black/20 text-xs backdrop-blur-sm transition">
                スキップ ▶▶
            </button>
        </div>

        <!-- テキスト表示エリア（長文でも画面外に飛び出さず確実にスクロール） -->
        <div id="novel-scroll-wrapper" class="relative z-10 flex-1 min-h-0 overflow-y-auto my-3 pr-1 flex flex-col">
            <div id="novel-text-container" class="my-auto py-2 space-y-4 font-novel text-[15px] sm:text-base leading-8">
                <!-- JSで動的に行を追加 -->
            </div>
        </div>

        <!-- 下部アクションエリア（常に画面下部に固定表示） -->
        <div class="relative z-10 pt-2 pb-2 shrink-0 flex flex-col items-center">
            <div id="novel-tap-hint" class="text-xs opacity-55 animate-pulse mb-1">
                タップ / クリック（または Enter）で進む
            </div>
            <button id="btn-novel-next" class="hidden w-full py-3.5 rounded-xl font-medium tracking-wider shadow-sm transition active:scale-[0.99]">
                次へ
            </button>
        </div>
    </div>

    <!-- ==================== 3. 謝罪文組み立て画面 ==================== -->
    <div id="screen-compose" class="hidden flex-1 min-h-0 flex flex-col bg-slate-100 text-slate-800">
        <!-- ヘッダー -->
        <header class="bg-white px-4 py-3 border-b border-slate-200 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-2">
                <button id="btn-compose-to-title" class="p-2 -ml-2 text-slate-400 hover:text-slate-700 rounded-lg transition text-xs">
                    ← タイトル
                </button>
                <span class="font-bold text-sm text-slate-700">柏木 への返信作成</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-open-endings" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium transition">
                    記録 (<span id="compose-end-count">0</span>/5)
                </button>
                <button id="btn-open-memo" class="px-3 py-1.5 rounded-lg bg-amber-50 border border-amber-200 hover:bg-amber-100 text-amber-800 text-xs font-medium flex items-center gap-1 transition relative">
                    <span>メモ</span>
                    <span id="memo-badge" class="bg-amber-500 text-white text-[10px] px-1.5 rounded-full">0</span>
                </button>
            </div>
        </header>

        <!-- 上部：プレビュー欄 -->
        <div class="p-4 pb-2 shrink-0">
            <div class="text-[11px] text-slate-500 mb-1.5 flex justify-between items-center">
                <span>送信メッセージ プレビュー</span>
                <button id="btn-clear-slots" class="text-slate-400 hover:text-slate-600 underline">リセット</button>
            </div>
            <div id="compose-preview" class="bg-white border border-slate-200 rounded-2xl p-3.5 min-h-[104px] max-h-[136px] overflow-y-auto text-[13.5px] sm:text-sm leading-relaxed text-slate-800 shadow-inner break-words">
                <!-- JSで連結文を描画 -->
            </div>
        </div>

        <!-- 中部：4つのスロット -->
        <div class="flex-1 min-h-0 px-4 py-2 overflow-y-auto space-y-2.5">
            <div class="text-[11px] text-slate-500 mb-1 flex justify-between">
                <span>タップして文章を選択（全4箇所）</span>
                <span class="hidden sm:inline text-slate-400">キー操作: 1〜4</span>
            </div>
            
            <button data-stage="1" class="slot-btn w-full text-left bg-white hover:bg-slate-50 hover:border-slate-300 border border-slate-200 rounded-xl p-3 transition flex items-start gap-3 shadow-sm">
                <span class="shrink-0 w-6 h-6 rounded-full bg-slate-800 text-white text-xs flex items-center justify-center font-bold mt-0.5">①</span>
                <div class="flex-1 min-w-0">
                    <div class="text-[11px] text-slate-400">原因・理由</div>
                    <div id="slot-text-1" class="text-xs sm:text-sm text-slate-400 break-words mt-0.5">？（タップして選択）</div>
                </div>
            </button>

            <button data-stage="2" class="slot-btn w-full text-left bg-white hover:bg-slate-50 hover:border-slate-300 border border-slate-200 rounded-xl p-3 transition flex items-start gap-3 shadow-sm">
                <span class="shrink-0 w-6 h-6 rounded-full bg-slate-800 text-white text-xs flex items-center justify-center font-bold mt-0.5">②</span>
                <div class="flex-1 min-w-0">
                    <div class="text-[11px] text-slate-400">昨夜の状況</div>
                    <div id="slot-text-2" class="text-xs sm:text-sm text-slate-400 break-words mt-0.5">？（タップして選択）</div>
                </div>
            </button>

            <button data-stage="3" class="slot-btn w-full text-left bg-white hover:bg-slate-50 hover:border-slate-300 border border-slate-200 rounded-xl p-3 transition flex items-start gap-3 shadow-sm">
                <span class="shrink-0 w-6 h-6 rounded-full bg-slate-800 text-white text-xs flex items-center justify-center font-bold mt-0.5">③</span>
                <div class="flex-1 min-w-0">
                    <div class="text-[11px] text-slate-400">現在のスタンス</div>
                    <div id="slot-text-3" class="text-xs sm:text-sm text-slate-400 break-words mt-0.5">？（タップして選択）</div>
                </div>
            </button>

            <button data-stage="4" class="slot-btn w-full text-left bg-white hover:bg-slate-50 hover:border-slate-300 border border-slate-200 rounded-xl p-3 transition flex items-start gap-3 shadow-sm">
                <span class="shrink-0 w-6 h-6 rounded-full bg-slate-800 text-white text-xs flex items-center justify-center font-bold mt-0.5">④</span>
                <div class="flex-1 min-w-0">
                    <div class="text-[11px] text-slate-400">結び・対応</div>
                    <div id="slot-text-4" class="text-xs sm:text-sm text-slate-400 break-words mt-0.5">？（タップして選択）</div>
                </div>
            </button>
        </div>

        <!-- 下部：送信ボタン -->
        <div class="p-4 bg-white border-t border-slate-200 shrink-0">
            <button id="btn-send-apology" disabled class="w-full py-3.5 rounded-xl font-bold text-sm tracking-wider transition bg-slate-200 text-slate-400 cursor-not-allowed">
                4つすべて選択してください
            </button>
        </div>
    </div>

    <!-- ==================== 4. LINE風チャット画面 ==================== -->
    <div id="screen-chat" class="hidden flex-1 min-h-0 flex flex-col bg-[#7494c0] text-slate-800">
        <!-- トークヘッダー -->
        <header class="bg-[#273246] text-white px-4 py-3 flex items-center justify-between shrink-0 shadow">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-slate-500 flex items-center justify-center text-xs font-bold text-white">
                    柏
                </div>
                <div>
                    <div class="font-bold text-sm">柏木</div>
                    <div class="text-[10px] text-slate-300">同窓会幹事</div>
                </div>
            </div>
            <div id="chat-status-hint" class="text-[11px] text-slate-300">
                返信を待っています...
            </div>
        </header>

        <!-- トーク履歴エリア -->
        <div id="chat-messages" class="flex-1 min-h-0 p-4 overflow-y-auto space-y-3">
            <!-- JSで吹き出しを追加 -->
        </div>

        <!-- 擬似入力欄（演出用＋次へボタン） -->
        <div class="bg-white border-t border-slate-200 p-3 shrink-0">
            <div id="chat-input-bar" class="flex items-center gap-2">
                <div class="flex-1 bg-slate-100 rounded-full px-4 py-2 text-sm text-slate-700 min-h-[38px] flex items-center">
                    <span id="chat-typing-sim" class="text-slate-800"></span>
                    <span id="chat-placeholder" class="text-slate-400 text-xs">メッセージを入力</span>
                </div>
                <div class="w-9 h-9 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center text-xs">
                    送信
                </div>
            </div>
            <button id="btn-chat-to-ending" class="hidden w-full py-3 rounded-xl bg-slate-900 text-white text-sm font-medium tracking-wider hover:bg-slate-800 transition animate-fade-in">
                画面を閉じる
            </button>
        </div>
    </div>

    <!-- ==================== 5. 暗転END画面（真相エンド用） ==================== -->
    <div id="screen-true-end" class="hidden flex-1 flex flex-col items-center justify-center bg-black text-white p-8">
        <div id="true-end-text" class="font-novel text-2xl tracking-[0.4em] opacity-0 transition-opacity duration-1000">
            END
        </div>
        <div id="true-end-actions" class="hidden mt-12 flex flex-col items-center gap-3 animate-fade-in">
            <button id="btn-true-end-finish" class="px-7 py-2.5 rounded-full border border-white/30 text-xs text-white/80 hover:text-white hover:border-white transition">
                記録を見る
            </button>
            <button id="btn-share-x" class="px-5 py-2 rounded-full bg-white/10 hover:bg-white/20 text-[11px] text-white/70 hover:text-white transition flex items-center gap-1.5">
                <span>X で感想をポストする</span>
            </button>
        </div>
    </div>

    <!-- ==================== モーダル：選択肢ポップアップ ==================== -->
    <div id="modal-choices" class="hidden absolute inset-0 z-30 bg-black/50 backdrop-blur-[1px] flex flex-col justify-end">
        <div class="bg-white rounded-t-3xl p-5 max-h-[82%] flex flex-col shadow-2xl animate-fade-in">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 shrink-0">
                <span id="modal-choice-title" class="font-bold text-sm text-slate-800">① 原因を選択</span>
                <button id="btn-close-choices" class="p-2 text-slate-400 hover:text-slate-700 text-sm">閉じる ✕</button>
            </div>
            <div id="modal-choice-list" class="py-3 overflow-y-auto space-y-2.5">
                <!-- 選択肢ボタン5個を動的生成（番号順固定・見た目均一） -->
            </div>
        </div>
    </div>

    <!-- ==================== モーダル：ヒントメモ画面 ==================== -->
    <div id="modal-memo" class="hidden absolute inset-0 z-30 bg-black/50 backdrop-blur-[1px] flex items-center justify-center p-4">
        <div class="bg-[#fffdf7] border border-amber-200 rounded-2xl w-full max-w-sm max-h-[80%] flex flex-col shadow-xl animate-fade-in">
            <div class="px-5 py-4 border-b border-amber-100 flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-amber-950 text-base">思い出のメモ</h2>
                    <p class="text-[11px] text-amber-700/70">返信から引っかかった言葉の記録</p>
                </div>
                <button id="btn-close-memo" class="p-2 text-amber-800/60 hover:text-amber-950">✕</button>
            </div>
            <div id="memo-list" class="p-5 overflow-y-auto space-y-2.5 flex-1">
                <!-- ヒント6枠を描画 -->
            </div>
        </div>
    </div>

    <!-- ==================== モーダル：エンド一覧＆再読画面 ==================== -->
    <div id="modal-endings" class="hidden absolute inset-0 z-30 bg-black/50 backdrop-blur-[1px] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm max-h-[85%] flex flex-col shadow-xl animate-fade-in overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h2 class="font-bold text-slate-800 text-base">エンディング一覧</h2>
                <button id="btn-close-endings" class="p-2 text-slate-400 hover:text-slate-700">✕</button>
            </div>
            
            <!-- 一覧リストビュー -->
            <div id="endings-list-view" class="p-5 overflow-y-auto space-y-3 flex-1">
                <!-- 5つのエンド枠を描画 -->
            </div>

            <!-- 再読ビュー -->
            <div id="endings-read-view" class="hidden p-5 overflow-y-auto flex-1 flex flex-col justify-between bg-slate-50">
                <div>
                    <button id="btn-back-to-endings-list" class="text-xs text-slate-500 hover:text-slate-800 mb-3 inline-flex items-center gap-1">
                        ← 一覧に戻る
                    </button>
                    <h3 id="reread-title" class="font-bold text-base text-slate-900 mb-4 pb-2 border-b border-slate-200"></h3>
                    <div id="reread-content" class="font-novel text-sm leading-7 text-slate-700 space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== モーダル：カスタム確認ダイアログ（alert/confirm禁止対策） ==================== -->
    <div id="modal-dialog" class="hidden absolute inset-0 z-40 bg-black/60 flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl space-y-4 animate-fade-in">
            <h3 id="dialog-title" class="font-bold text-slate-900 text-base">確認</h3>
            <p id="dialog-message" class="text-xs text-slate-600 leading-relaxed"></p>
            <div class="flex justify-end gap-2 pt-2">
                <button id="btn-dialog-cancel" class="px-4 py-2 rounded-lg text-xs text-slate-600 hover:bg-slate-100 transition">キャンセル</button>
                <button id="btn-dialog-ok" class="px-4 py-2 rounded-lg text-xs bg-red-600 text-white hover:bg-red-700 transition">削除する</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * ============================================================================
 * 1. ゲームデータ定義（仕様書 v1.2 準拠・テキスト改変なし）
 * ============================================================================
 */
const PHRASE_DATA = {
    prefix: "昨日の件、ご連絡ありがとうございます。",
    stages: {
        1: [
            { id: "s1_1", type: "funny", text: "地球の自転がわずかに狂っていたせいで、" },
            { id: "s1_2", type: "funny", text: "そもそも私の辞書から「謝罪」のページが破り取られていたため、" },
            { id: "s1_3", type: "funny", text: "昨日食べた唐揚げ棒の衣が、まだ胃に残っているせいで、" },
            { id: "s1_4", type: "serious", text: "久しぶりに地元に戻って、気が緩んでいたため、" },
            {
                id: "s1_5", type: "serious", text: "連絡を受けて、慌てて昨夜のことを思い返してみたところ、",
                hidden: { id: "h1_5", unlock: 2, text: "昨夜のことだけでなく、三年前の朝のことも謝らなければならない気がするため、" }

/**
 * ============================================================================
 * 2. サウンドエンジン（Tone.js - 外部ファイル不使用・トーン変化対応）
 * ============================================================================
 */
class SoundEngine {
    constructor() {
        this.enabled = true;
        this.initialized = false;
        this.bgmLoop = null;
        this.bgmSynth = null;
        this.bgmGain = null;
        this.currentMood = 'none'; // 'light' | 'quiet' | 'none'
    }

    async init() {
        if (this.initialized) return;
        try {
            await Tone.start();
            this.bgmGain = new Tone.Gain(0.12).toDestination();
            this.bgmSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.4, decay: 0.5, sustain: 0.4, release: 1.8 }
            }).connect(this.bgmGain);

            this.sfxSynth = new Tone.Synth({
                oscillator: { type: "triangle" },
                envelope: { attack: 0.01, decay: 0.12, sustain: 0, release: 0.1 }
            }).toDestination();
            this.sfxSynth.volume.value = -10;

            this.initialized = true;
        } catch (e) {
            console.warn("Audio init skipped:", e);
        }
    }

    toggle() {
        this.enabled = !this.enabled;
        if (!this.enabled) {
            this.stopBGM();
        } else if (this.currentMood !== 'none') {
            this.playBGM(this.currentMood);
        }
        return this.enabled;
    }

    playTap() {
        if (!this.enabled || !this.initialized) return;
        this.sfxSynth.triggerAttackRelease("C5", "32n");
    }

    playSend() {
        if (!this.enabled || !this.initialized) return;
        const now = Tone.now();
        this.sfxSynth.triggerAttackRelease("E5", "16n", now);
        this.sfxSynth.triggerAttackRelease("A5", "16n", now + 0.08);
    }

    playReceive() {
        if (!this.enabled || !this.initialized) return;
        const now = Tone.now();
        this.sfxSynth.triggerAttackRelease("G5", "32n", now);
        this.sfxSynth.triggerAttackRelease("D5", "16n", now + 0.06);
    }

    playKeyType() {
        if (!this.enabled || !this.initialized) return;
        this.sfxSynth.triggerAttackRelease("C6", "64n");
    }

    playBGM(mood) {
        this.currentMood = mood;
        if (!this.enabled || !this.initialized) return;
        this.stopBGM(false);

        this.bgmGain.gain.cancelScheduledValues(Tone.now());
        this.bgmGain.gain.value = mood === 'light' ? 0.10 : 0.08;

        const lightNotes = [
            ["C4", "E4"], ["G4"], ["A4", "C5"], ["G4"],
            ["F4", "A4"], ["E4"], ["D4", "G4"], ["G4"]
        ];
        const quietNotes = [
            ["F3", "C4", "A4"], null, ["E3", "B3", "G4"], null,
            ["D3", "A3", "F4"], null, ["C3", "G3", "E4"], null
        ];

        const pattern = mood === 'light' ? lightNotes : quietNotes;
        let step = 0;

        this.bgmLoop = new Tone.Loop((time) => {
            const chord = pattern[step % pattern.length];
            if (chord) {
                this.bgmSynth.triggerAttackRelease(chord, mood === 'light' ? "4n" : "1n", time);
            }
            step++;
        }, mood === 'light' ? "2n" : "1m").start(0);

        Tone.Transport.start();
    }

    fadeOutBGM(durationSec = 4) {
        if (!this.initialized || !this.bgmGain) return;
        this.bgmGain.gain.rampTo(0, durationSec);
        setTimeout(() => {
            this.stopBGM();
        }, durationSec * 1000);
    }

    stopBGM(resetMood = true) {
        if (resetMood) this.currentMood = 'none';
        if (this.bgmLoop) {
            this.bgmLoop.stop();
            this.bgmLoop.dispose();
            this.bgmLoop = null;
        }
    }
}

const STORAGE_KEY = "kinou_no_ken_save_v1";

const DEFAULT_SAVE = {
    endingsSeen: [],
    hintsGot: [],

    eventsPlayed: [],
    prologueSeen: false
};

let saveData = loadSaveData();
let selectedPhrases = { 1: null, 2: null, 3: null, 4: null };

function loadSaveData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
        const parsed = JSON.parse(raw);
        return {
            endingsSeen: Array.isArray(parsed.endingsSeen) ? parsed.endingsSeen : [],
            hintsGot: Array.isArray(parsed.hintsGot) ? parsed.hintsGot : [],
            unlockStage: typeof parsed.unlockStage === "number" ? parsed.unlockStage : 0,
            eventsPlayed: Array.isArray(parsed.eventsPlayed) ? parsed.eventsPlayed : [],
            prologueSeen: Boolean(parsed.prologueSeen)
        };
    } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_SAVE));
    }
}

function persistSaveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
    } catch (e) {
        console.warn("Save failed:", e);
    }
    updateMetaCounters();
}

function resetSaveData() {
    saveData = JSON.parse(JSON.stringify(DEFAULT_SAVE));
    selectedPhrases = { 1: null, 2: null, 3: null, 4: null };
    try {
        localStorage.removeItem(STORAGE_KEY);
    } catch (e) {}
    updateMetaCounters();
}

function updateMetaCounters() {
    document.getElementById("title-end-count").textContent = saveData.endingsSeen.length;
    document.getElementById("compose-end-count").textContent = saveData.endingsSeen.length;

function getActiveStageChoices(stageNum) {
    const rawList = PHRASE_DATA.stages[stageNum];
    return rawList.map(item => {
        if (item.hidden && saveData.unlockStage >= item.hidden.unlock) {
            return {
                id: item.hidden.id,
                type: "hidden",
                text: item.hidden.text
            };
        }
        return {
            id: item.id,
            type: item.type,
            text: item.text
        };
    });
}

function evaluateApology(p1, p2, p3, p4) {
    const list = [p1, p2, p3, p4];
    const funnyCount = list.filter(p => p.type === "funny").length;
    const hiddenCount = list.filter(p => p.type === "hidden").length;

    // 優先1: hidden == 4 -> TRUE
    if (hiddenCount === 4) {
        return { endId: "TRUE", funnyCount, hiddenCount };
    }
    // 優先2: funny >= 3 かつ ④が s4_1 -> FUN3
    if (funnyCount >= 3 && p4.id === "s4_1") {
        return { endId: "FUN3", funnyCount, hiddenCount };
    }
    // 優先3: funny == 4（④は s4_2 か s4_3） -> FUN2
    if (funnyCount === 4) {
        return { endId: "FUN2", funnyCount, hiddenCount };
    }
    // 優先4: funny == 3 -> FUN1
    if (funnyCount === 3) {
        return { endId: "FUN1", funnyCount, hiddenCount };
    }
    // 優先5: 上記以外 -> NORMAL
    return { endId: "NORMAL", funnyCount, hiddenCount };
}

let novelState = {
    steps: [],
    currentIndex: 0,
    onComplete: null,
    isFinished: false
};

function startNovelScene(options) {
    const {
        theme = "light", // "light" | "dark" | "station"
        badge = "",
        skippable = false,
        steps = [],
        buttonText = "次へ",
        onComplete = () => {}
    } = options;

    showScreen("novel");

    const screenEl = document.getElementById("screen-novel");
    const bgLayer = document.getElementById("novel-bg-layer");
    const badgeEl = document.getElementById("novel-badge");
    const skipBtn = document.getElementById("btn-novel-skip");
    const container = document.getElementById("novel-text-container");
    const tapHint = document.getElementById("novel-tap-hint");
    const nextBtn = document.getElementById("btn-novel-next");

    // テーマ適用
    screenEl.className = "flex-1 min-h-0 flex flex-col p-6 relative transition-colors duration-1000 cursor-pointer";
    bgLayer.innerHTML = "";
    bgLayer.style.opacity = "0.25";

    if (theme === "dark") {
        screenEl.classList.add("bg-slate-950", "text-slate-100");
        nextBtn.className = "hidden w-full py-3.5 rounded-xl font-medium tracking-wider shadow-sm transition bg-white text-slate-900 hover:bg-slate-200";
    } else if (theme === "station") {
        screenEl.classList.add("bg-sky-50", "text-slate-800");
        bgLayer.innerHTML = getBackgroundSVG("station");
        bgLayer.style.opacity = "0.65";
        nextBtn.className = "hidden w-full py-3.5 rounded-xl font-medium tracking-wider shadow-sm transition bg-slate-900 text-white hover:bg-slate-800";
    } else {
        screenEl.classList.add("bg-[#f7f5f0]", "text-slate-800");
        if (badge === "PROLOGUE") {
            bgLayer.innerHTML = getBackgroundSVG("hotel");
        }
        nextBtn.className = "hidden w-full py-3.5 rounded-xl font-medium tracking-wider shadow-sm transition bg-slate-900 text-white hover:bg-slate-800";
    }

    badgeEl.textContent = badge === "PROLOGUE" ? "8:41" : badge;
    if (skippable) {
        skipBtn.classList.remove("hidden");
    } else {
        skipBtn.classList.add("hidden");
    }

    container.innerHTML = "";
    tapHint.classList.remove("hidden");
    nextBtn.classList.add("hidden");
    nextBtn.textContent = buttonText;

    novelState = {
        steps,
        currentIndex: 0,
        onComplete,
        isFinished: false,
        fadeOutTriggered: false
    };

    // 最初の1ステップを表示
    advanceNovelStep();
}

function advanceNovelStep() {
    if (novelState.isFinished) return;

    const scrollWrapper = document.getElementById("novel-scroll-wrapper");
    const container = document.getElementById("novel-text-container");
    const tapHint = document.getElementById("novel-tap-hint");
    const nextBtn = document.getElementById("btn-novel-next");

    if (novelState.currentIndex >= novelState.steps.length) {
        novelState.isFinished = true;
        tapHint.classList.add("hidden");
        nextBtn.classList.remove("hidden");
        document.getElementById("btn-novel-skip").classList.add("hidden");
        return;
    }

    const step = novelState.steps[novelState.currentIndex];
    novelState.currentIndex++;

    // 真相エンド最後のモノローグ終盤でBGMフェードアウト
    if (step.fadeOutBgm && !novelState.fadeOutTriggered) {
        novelState.fadeOutTriggered = true;
        sound.fadeOutBGM(4.5);
    }

    if (step.type === "line_box") {
        // プロローグ内のLINE表示ボックス
        const box = document.createElement("div");
        box.className = "novel-line my-2 p-3.5 rounded-2xl bg-[#7494c0]/20 border border-[#7494c0]/30 space-y-2 font-sans text-xs";
        step.messages.forEach(msg => {
            const row = document.createElement("div");
            row.className = "flex items-start gap-2";
            row.innerHTML = `
                <span class="shrink-0 px-1.5 py-0.5 rounded bg-slate-700 text-white text-[10px]">柏木</span>
                <span class="bg-white text-slate-800 px-3 py-1.5 rounded-xl rounded-tl-none shadow-xs">${msg}</span>
            `;
            box.appendChild(row);
        });
        container.appendChild(box);
        requestAnimationFrame(() => box.classList.add("visible"));
    } else {
        const p = document.createElement("p");
        p.className = "novel-line whitespace-pre-wrap";
        p.textContent = step.text;
        container.appendChild(p);
        requestAnimationFrame(() => p.classList.add("visible"));
    }

    // スクロールコンテナを最下部へ滑らかに追従
    requestAnimationFrame(() => {
        scrollWrapper.scrollTo({
            top: scrollWrapper.scrollHeight,
            behavior: "smooth"
        });
    });

    // 最後の行を表示し終えたら即座に次へボタンを出す
    if (novelState.currentIndex >= novelState.steps.length) {
        novelState.isFinished = true;
        tapHint.classList.add("hidden");
        nextBtn.classList.remove("hidden");
        document.getElementById("btn-novel-skip").classList.add("hidden");
    }
}

document.getElementById("screen-novel").addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    if (!novelState.isFinished) {
        sound.playTap();
        advanceNovelStep();
    }
});

document.getElementById("btn-novel-skip").addEventListener("click", () => {
    sound.playTap();
    if (novelState.onComplete) novelState.onComplete();
});

document.getElementById("btn-novel-next").addEventListener("click", () => {
    sound.playTap();
    if (novelState.onComplete) novelState.onComplete();
});

    const result = evaluateApology(p1, p2, p3, p4);

        sound.playBGM("quiet");
    }

    runChatSequence(fullApologyText, result);

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function runChatSequence(apologyText, result) {
    showScreen("chat");

    const messagesEl = document.getElementById("chat-messages");
    const statusHint = document.getElementById("chat-status-hint");
    const inputBar = document.getElementById("chat-input-bar");
    const closeChatBtn = document.getElementById("btn-chat-to-ending");
    const typingSim = document.getElementById("chat-typing-sim");
    const placeholder = document.getElementById("chat-placeholder");

    messagesEl.innerHTML = "";
    inputBar.classList.remove("hidden");
    closeChatBtn.classList.add("hidden");
    typingSim.textContent = "";
    placeholder.classList.remove("hidden");
    statusHint.textContent = "送信済み";

    const endData = ENDINGS_DATA[result.endId];

    // 1. 送信した謝罪文を右側の吹き出しで表示（改行なし自然折り返し）
    appendRightBubble(messagesEl, apologyText, endData.readTime, false);
    await sleep(600);

    // 送信直後に「既読」表示
    const readLabel = messagesEl.querySelector(".read-status");
    if (readLabel) {
        readLabel.textContent = "既読";
    }
    statusHint.textContent = "柏木が入力中...";
    await sleep(900);

    // 2. スクリプト取得
    const script = result.endId === "NORMAL"
        ? buildNormalChatScript(result.hiddenCount)
        : endData.chatScript;

    // 3. 1行ずつ演出実行
    for (const item of script) {
        if (item.type === "kashiwagi") {
            sound.playReceive();
            appendLeftBubble(messagesEl, item.text);
            // 行の長さに応じた時間差（0.8〜1.5秒目安）
            const delay = Math.min(1550, Math.max(850, 650 + item.text.length * 32));
            await sleep(delay);
        } else if (item.type === "photo") {
            sound.playReceive();
            appendLeftPhotoBubble(messagesEl);
            await sleep(1300);
        } else if (item.type === "typing_indicator") {
            statusHint.textContent = "柏木が入力中...";
            const ind = appendTypingIndicator(messagesEl);
            await sleep(item.duration || 3000);
            ind.remove();
        } else if (item.type === "gomen_erase") {
            // 「ごめん」と1文字ずつ打ち、1秒待ってから1文字ずつ消す演出
            statusHint.textContent = "";
            placeholder.classList.add("hidden");
            const word = ["ご", "め", "ん"];
            for (let i = 0; i < word.length; i++) {
                sound.playKeyType();
                typingSim.textContent += word[i];
                await sleep(280);
            }
            await sleep(1000);
            for (let i = word.length; i > 0; i--) {
                sound.playKeyType();
                typingSim.textContent = typingSim.textContent.slice(0, -1);
                await sleep(220);
            }
            placeholder.classList.remove("hidden");
            await sleep(500);
        } else if (item.type === "me") {
            await sleep(400);
            sound.playSend();
            appendRightBubble(messagesEl, item.text, endData.readTime, true);
            await sleep(900);
        }
    }

    statusHint.textContent = "";
    inputBar.classList.add("hidden");
    closeChatBtn.classList.remove("hidden");
    closeChatBtn.textContent = result.endId === "TRUE" ? "駅へ向かう" : "画面を閉じる";

    closeChatBtn.onclick = () => {
        sound.playTap();
        handleEndReached(result.endId);
    };
}

/**
 * ============================================================================
 * 10. 結末テキスト・ヒント加算・解放イベント順次再生（仕様書第7章・第9章）
 * ============================================================================
 */
function handleEndReached(endId) {
    const endData = ENDINGS_DATA[endId];

    // エンド到達記録
    if (!saveData.endingsSeen.includes(endId)) {
        saveData.endingsSeen.push(endId);
    }

    // ヒント取得（重複加算しない）
    endData.hints.forEach(hId => {
        if (!saveData.hintsGot.includes(hId)) {
            saveData.hintsGot.push(hId);
        }
    });

    persistSaveData();

    if (endId === "TRUE") {
        // 真相エンドの最後のモノローグ（背景：駅のホーム・朝の光）
        const steps = endData.epilogue.map((line, idx) => ({
            text: line,
            // 最後の数行でBGMをフェードアウト（仕様書第10章）
            fadeOutBgm: idx >= endData.epilogue.length - 3
        }));

        startNovelScene({
            theme: "station",
            badge: "8時12分",
            skippable: false,
            steps,
            buttonText: "次へ",
            onComplete: () => {
                showTrueEndCurtain();
            }
        });
    } else {
        // 通常・おふざけエンドの結末テキスト
        const steps = endData.epilogue.map(line => ({ text: line }));
        startNovelScene({
            theme: "light",
            badge: endData.title,
            skippable: false,
            steps,
            buttonText: "▶ もう一度書く",
            onComplete: () => {
                checkAndPlayUnlockEvents();
            }
        });
    }
}

function checkAndPlayUnlockEvents() {
    const hintCount = saveData.hintsGot.length;
    const pendingStages = [];

    // 閾値を初めて超えた段階を順番にキューへ積む（複数段階またぎにも対応）
    if (hintCount >= 2 && !saveData.eventsPlayed.includes(1)) {
        pendingStages.push(1);
    }
    if (hintCount >= 4 && !saveData.eventsPlayed.includes(2)) {
        pendingStages.push(2);
    }
    if (hintCount >= 6 && !saveData.eventsPlayed.includes(3)) {
        pendingStages.push(3);
    }

    if (pendingStages.length === 0) {
        enterComposeScreen();
        return;
    }

    // 選択中フレーズをリセット（仕様書第7-2章）
    selectedPhrases = { 1: null, 2: null, 3: null, 4: null };

    const playNextEvent = () => {
        if (pendingStages.length === 0) {
            enterComposeScreen();
            return;
        }
        const stage = pendingStages.shift();
        saveData.unlockStage = Math.max(saveData.unlockStage, stage);
        if (!saveData.eventsPlayed.includes(stage)) {
            saveData.eventsPlayed.push(stage);
        }
        persistSaveData();

        sound.playBGM("quiet");
        const ev = UNLOCK_EVENTS[stage];
        const steps = ev.lines.map(line => ({ text: line }));

        startNovelScene({
            theme: "dark",
            badge: ev.title,
            skippable: false,
            steps,
            buttonText: "▶ 謝罪文を組み立てる",
            onComplete: playNextEvent
        });
    };

    playNextEvent();
}

/**
 * ============================================================================
 * 11. ヒントメモ画面・エンド一覧画面・確認ダイアログ
 * ============================================================================
 */
function openMemoModal() {
    const listEl = document.getElementById("memo-list");
    listEl.innerHTML = "";

    // 取得順に取得済みヒントを表示し、残りは「？」枠を並べる（総数6個）
    saveData.hintsGot.forEach((hId, index) => {
        const hintObj = HINTS_MASTER.find(h => h.id === hId);
        if (!hintObj) return;
        const card = document.createElement("div");
        card.className = "p-3 rounded-xl bg-white border border-amber-200/80 text-xs text-slate-800 leading-relaxed shadow-2xs flex gap-2.5";
        card.innerHTML = `
            <span class="shrink-0 font-bold text-amber-600">${index + 1}.</span>
            <span>${hintObj.text}</span>
        `;
        listEl.appendChild(card);
    });

    const remaining = 6 - saveData.hintsGot.length;
    for (let i = 0; i < remaining; i++) {
        const num = saveData.hintsGot.length + i + 1;
        const emptyCard = document.createElement("div");
        emptyCard.className = "p-3 rounded-xl bg-amber-100/40 border border-dashed border-amber-200 text-xs text-amber-800/40 flex gap-2.5";
        emptyCard.innerHTML = `
            <span class="shrink-0 font-bold">${num}.</span>
            <span>？？？</span>
        `;
        listEl.appendChild(emptyCard);
    }

    document.getElementById("modal-memo").classList.remove("hidden");
}

function openEndingsModal() {
    const listView = document.getElementById("endings-list-view");
    const readView = document.getElementById("endings-read-view");
    listView.classList.remove("hidden");
    readView.classList.add("hidden");
    listView.innerHTML = "";

    const orderedEndings = Object.values(ENDINGS_DATA).sort((a, b) => a.order - b.order);

    orderedEndings.forEach(endObj => {
        const isSeen = saveData.endingsSeen.includes(endObj.id);
        const btn = document.createElement("button");
        btn.disabled = !isSeen;
        btn.className = `w-full text-left p-3.5 rounded-xl border transition flex justify-between items-center ${
            isSeen
                ? "bg-white hover:bg-slate-50 border-slate-200 text-slate-800 shadow-2xs"
                : "bg-slate-50 border-slate-100 text-slate-400 cursor-default"
        }`;

        btn.innerHTML = `
            <div class="flex items-center gap-3">
                <span class="text-xs font-mono px-2 py-0.5 rounded ${isSeen ? "bg-slate-800 text-white" : "bg-slate-200 text-slate-400"}">
                    END ${endObj.order}
                </span>
                <span class="text-sm font-medium">${isSeen ? endObj.title : "？？？"}</span>
            </div>
            ${isSeen ? '<span class="text-xs text-slate-400">読む ›</span>' : ""}
        `;

        if (isSeen) {
            btn.addEventListener("click", () => {
                sound.playTap();
                openRereadEnding(endObj);
            });
        }

        listView.appendChild(btn);
    });

    document.getElementById("modal-endings").classList.remove("hidden");
}

function openRereadEnding(endObj) {
    document.getElementById("endings-list-view").classList.add("hidden");
    const readView = document.getElementById("endings-read-view");
    readView.classList.remove("hidden");

    document.getElementById("reread-title").textContent = endObj.title;
    const contentEl = document.getElementById("reread-content");
    contentEl.innerHTML = "";

    endObj.epilogue.forEach(line => {
        const p = document.createElement("p");
        p.className = "whitespace-pre-wrap";
        p.textContent = line;
        contentEl.appendChild(p);
    });
}

// PCキーボード操作サポート（Enter/Spaceでノベル進行、1〜4でスロット選択、Escでモーダル閉じる）
window.addEventListener("keydown", (e) => {
    const modalChoices = document.getElementById("modal-choices");
    const modalMemo = document.getElementById("modal-memo");
    const modalEndings = document.getElementById("modal-endings");
    const modalDialog = document.getElementById("modal-dialog");

    // モーダルが開いている場合のEsc処理
    if (e.key === "Escape") {
        if (!modalDialog.classList.contains("hidden")) {
            modalDialog.classList.add("hidden");
            return;
        }
        if (!modalChoices.classList.contains("hidden")) {
            closeChoiceModal();
            return;
        }
        if (!modalMemo.classList.contains("hidden")) {
            modalMemo.classList.add("hidden");
            return;
        }
        if (!modalEndings.classList.contains("hidden")) {
            modalEndings.classList.add("hidden");
            return;
        }
    }

    // ノベル画面表示中のキー操作
    if (!screens.novel.classList.contains("hidden")) {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            if (!novelState.isFinished) {
                sound.playTap();
                advanceNovelStep();
            } else {
                const nextBtn = document.getElementById("btn-novel-next");
                if (!nextBtn.classList.contains("hidden")) {
                    nextBtn.click();
                }
            }
        }
        return;
    }

    // 組み立て画面表示中のショートカット（モーダルが閉じているとき）
    const anyModalOpen = !modalChoices.classList.contains("hidden") ||
                         !modalMemo.classList.contains("hidden") ||
                         !modalEndings.classList.contains("hidden") ||
                         !modalDialog.classList.contains("hidden");

    if (!screens.compose.classList.contains("hidden") && !anyModalOpen) {
        if (["1", "2", "3", "4"].includes(e.key)) {
            sound.playTap();
            openChoiceModal(Number(e.key));
        }
    }
});
